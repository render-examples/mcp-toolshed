# One Web Service + one Postgres database.
# Tool definitions live in code (providers/*.ts); Postgres holds audit + API keys.

databases:
  - name: toolshed-db
    plan: basic-256mb

services:
  - type: web
    name: mcp-toolshed
    runtime: docker
    plan: starter
    preDeployCommand: npm run db:migrate
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: toolshed-db
          property: connectionString
      # Inserted into api_keys on first migrate — unset after deploy
      - key: TOOLSHED_BOOTSTRAP_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_MCP_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_TEAM_ID
        sync: false
      - key: SLACK_CHANNEL_IDS
        sync: false
      - key: TOOLSHED_KEY_ANALYST
        sync: false
      - key: TOOLSHED_KEY_IMPLEMENTER
        sync: false
      - key: TOOLSHED_KEY_DEPLOY_MANAGER
        sync: false
      - key: TICKET_API_URL
        sync: false
      - key: TICKET_API_KEY
        sync: false
