# One Web Service + one Postgres database.
# Tool definitions live in code (providers/*.ts); Postgres holds audit + API keys.

databases:
  - name: toolshed-db
    plan: basic-256mb

services:
  - type: web
    name: mcp-toolshed
    runtime: docker
    plan: starter
    maxShutdownDelaySeconds: 90
    preDeployCommand: npm run db:migrate:prod
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: toolshed-db
          property: connectionString
      # Inserted into api_keys on first migrate — unset after deploy
      - key: TOOLSHED_BOOTSTRAP_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_MCP_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_MCP_URL
        value: https://api.githubcopilot.com/mcp/
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_TEAM_ID
        sync: false
      - key: SLACK_CHANNEL_IDS
        sync: false
      - key: TOOLSHED_KEY_ANALYST
        sync: false
      - key: TOOLSHED_KEY_IMPLEMENTER
        sync: false
      - key: TICKET_API_URL
        sync: false
      - key: TICKET_API_KEY
        sync: false
      - key: TOOLSHED_AUDIT_RETENTION_DAYS
        value: "30"
      - key: TOOLSHED_AUDIT_MAX_ARGUMENT_BYTES
        value: "65536"
      - key: TOOLSHED_ALLOWED_ORIGINS
        sync: false
      - key: TOOLSHED_ALLOWED_HOSTS
        sync: false
      - key: TOOLSHED_DB_QUERY_TIMEOUT_MS
        value: "10000"
      - key: TOOLSHED_DB_STATEMENT_TIMEOUT_MS
        value: "10000"

  - type: cron
    name: mcp-toolshed-audit-cleanup
    runtime: docker
    plan: starter
    schedule: "17 3 * * *"
    dockerCommand: node dist/scripts/cleanup-audit.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: toolshed-db
          property: connectionString
      - key: TOOLSHED_AUDIT_RETENTION_DAYS
        value: "30"
      - key: TOOLSHED_AUDIT_CLEANUP_BATCH_SIZE
        value: "5000"
      - key: TOOLSHED_AUDIT_STALE_MINUTES
        value: "10"
      - key: TOOLSHED_DB_QUERY_TIMEOUT_MS
        value: "60000"
      - key: TOOLSHED_DB_STATEMENT_TIMEOUT_MS
        value: "60000"
